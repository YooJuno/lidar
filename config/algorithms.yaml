ground_removal:
  enabled: true
  use_cuda: true
  # Fast grid has matching CPU/CUDA rules. gseg3d selects the reference CPU library.
  mode: fast_grid

  # RANSAC plane fitting threshold. Smaller values reject non-road structures more strongly.
  distance_threshold_m: 0.15

  # Final ground mask threshold near the fitted plane.
  # If wheels/guardrail bottoms turn red, lower this first.
  final_distance_threshold_m: 0.20

  # Local low-point confirmation margin.
  # Lower values reduce false ground labels on low objects.
  local_ground_margin_m: 0.18

  # A point above the fitted plane by more than this is never ground.
  # This is the main guard against wheels and guardrail bottoms.
  max_above_plane_m: 0.22

  # Allow slightly more below-plane tolerance for calibration/noise.
  max_below_plane_m: 0.45

  # Distance-adaptive threshold: far LiDAR points are sparse/noisy.
  # Increase scale or max only if far road is not being marked red.
  adaptive_threshold_scale: 0.0025
  max_adaptive_threshold_m: 0.36

  max_ground_angle_deg: 15.0
  min_candidate_z: -3.0
  max_candidate_z: 1.5
  max_candidate_radius_m: 160.0
  candidate_grid_cell_m: 0.8
  grid_max_height_step_m: 0.22
  grid_max_local_slope_m_per_m: 0.18
  grid_seed_radius_m: 50.0
  grid_max_vertical_extent_m: 0.35
  max_iterations: 240
  min_inliers: 80

  # Original url-kaist Patchwork++; R-VPF, adaptive GLE and TGR are enabled.
  # Four CZM zones are fixed by the original implementation.
  patchwork_num_zones: 4
  patchwork_num_sectors: 32
  patchwork_min_points_per_patch: 12
  patchwork_seed_count: 20
  patchwork_refine_iterations: 3
  patchwork_min_range_m: 2.0
  patchwork_seed_threshold_m: 0.25
  patchwork_distance_threshold_m: 0.18
  patchwork_max_flatness_m2: 0.06

  # GSeg3D: two-phase, 3D grid ground segmentation vendored from
  # dfki-ric/ground_segmentation.  Points have already been transformed by
  # the viewer calibration; ground_height should normally remain at zero.
  gseg3d_cell_size_x_m: 1.0
  gseg3d_cell_size_y_m: 1.0
  gseg3d_cell_size_z_phase1_m: 10.0
  gseg3d_cell_size_z_phase2_m: 1.0
  gseg3d_slope_threshold_deg: 20.0
  gseg3d_ground_inlier_threshold_m: 0.20
  gseg3d_centroid_search_radius_m: 5.0
  gseg3d_ground_height_m: 0.0
  # Match the reference core's 0.30 m continuity limit. 0.10 m breaks
  # expansion even on a 7-degree ramp with 1 m XY cells.
  gseg3d_max_ground_height_deviation_m: 0.30
  gseg3d_cuda_seed_radius_m: 15.0
  gseg3d_cuda_cell_size_m: 0.50

clustering:
  enabled: true
  # Hashing alone is cheaper on the CPU than a device transfer for these clouds.
  use_cuda: false
  # XYZ connectivity keeps disconnected overhead surfaces separate.
  mode: euclidean_3d
  tolerance_m: 0.55
  grid_cell_m: 0.25
  range_tolerance_scale: 0.006
  max_tolerance_m: 1.15
  max_vertical_gap_m: 2.5
  min_height_m: 0.2
  max_height_m: 5.0
  min_width_m: 0.1
  max_width_m: 8.0
  min_length_m: 0.1
  max_length_m: 20.0
  min_cluster_size: 8
  max_cluster_size: 20000

detection:
  # Objects tab enables the separately installed original CenterPoint model.
  enabled: false
  min_confidence: 0.35
  min_points: 10
